version: 2

sources:
  - name: raw
    description: Raw data loaded from the Carbon Intensity API
    schema: main
    tables:
      - name: raw_national_intensity
        description: Raw national carbon-intensity readings
        columns:
          - name: valid_from
            description: Start time of the half-hour window
            tests:
              - not_null
          - name: valid_to
            description: End time of the half-hour window
            tests:
              - not_null
          - name: forecast
            description: Forecasted carbon intensity (g CO2/kWh)
          - name: actual
            description: Actual carbon intensity (g CO2/kWh)
          - name: index
            description: Carbon intensity index level
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [low, moderate, high, very_high, unknown]
      - name: raw_generation
        description: Raw generation mix by fuel type
        columns:
          - name: valid_from
            description: Start time of the half-hour window
            tests:
              - not_null
          - name: valid_to
            description: End time of the half-hour window
            tests:
              - not_null
          - name: fuel_type
            description: Type of fuel (coal, gas, wind, nuclear, etc.)
            tests:
              - not_null
          - name: percentage
            description: Percentage of generation from this fuel type
            tests:
              - not_null

models:
  - name: stg_national_intensity
    description: Staging model for national carbon-intensity readings
    columns:
      - name: valid_from
        description: Start time of the half-hour window
        tests:
          - not_null
      - name: valid_to
        description: End time of the half-hour window
        tests:
          - not_null
      - name: forecast
        description: Forecasted carbon intensity (g CO2/kWh)
      - name: actual
        description: Actual carbon intensity (g CO2/kWh)
      - name: index
        description: Carbon intensity index level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, moderate, high, very_high, unknown]

  - name: stg_generation
    description: Staging model for generation mix by fuel type
    columns:
      - name: valid_from
        description: Start time of the half-hour window
        tests:
          - not_null
      - name: valid_to
        description: End time of the half-hour window
        tests:
          - not_null
      - name: fuel_type
        description: Type of fuel (coal, gas, wind, nuclear, etc.)
        tests:
          - not_null
      - name: percentage
        description: Percentage of generation from this fuel type
        tests:
          - not_null

  - name: mart_daily_intensity
    description: Daily aggregated carbon-intensity metrics
    columns:
      - name: intensity_date
        description: Calendar date of the readings
        tests:
          - not_null
          - unique
      - name: avg_actual_intensity
        description: Average actual carbon intensity for the day (g CO2/kWh)
        tests:
          - not_null
      - name: avg_forecast_intensity
        description: Average forecasted carbon intensity for the day (g CO2/kWh)
      - name: reading_count
        description: Number of half-hourly readings included in the average
        tests:
          - not_null

  - name: mart_daily_index_share
    description: Daily percentage of time spent at each carbon-intensity index level
    columns:
      - name: intensity_date
        description: Calendar date of the readings
        tests:
          - not_null
      - name: index
        description: Carbon intensity index level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [low, moderate, high, very_high]
      - name: share_percent
        description: Percentage of half-hourly readings at this index level
        tests:
          - not_null
    tests:
      - percentages_sum_to_100:
          arguments:
            column_name: share_percent
            group_by_cols: intensity_date
