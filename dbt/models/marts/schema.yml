version: 2

models:
  - name: mart_daily_intensity
    description: Daily aggregate carbon intensity readings (actual and forecast)
    columns:
      - name: intensity_date
        description: Date of the daily aggregate (UTC)
        tests:
          - not_null
          - unique
      - name: avg_actual_intensity
        description: Average actual carbon intensity for the day (gCO₂/kWh)
        tests:
          - not_null
      - name: avg_forecast_intensity
        description: Average forecast carbon intensity for the day (gCO₂/kWh)
        tests:
          - not_null
      - name: reading_count
        description: Number of half-hourly readings in the daily aggregate
        tests:
          - not_null
